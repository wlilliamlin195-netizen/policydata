name: Weekly official source monitor

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: policy-refresh
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate current database
        run: npm test

      - name: Check official sources without AI
        id: monitor
        run: node scripts/check-source-changes.mjs

      - name: Save monitor state
        shell: bash
        run: |
          git config user.name "policy-delta-bot"
          git config user.email "policy-delta-bot@users.noreply.github.com"
          git add data/monitor-state.json data/monitor-report.md
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: weekly official source check"
            git push
          fi

      - name: Create a review reminder
        if: steps.monitor.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "请核对：官方政策来源页面发生变化" \
            --body-file data/monitor-report.md
