name: Weekly policy check

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate current database
        run: npm test

      - name: Check official policy sources
        run: npm run sync
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          AUTO_PUBLISH: "false"

      - name: Validate resulting database
        run: npm run validate

      - name: Save review queue
        shell: bash
        run: |
          git config user.name "policy-delta-bot"
          git config user.email "policy-delta-bot@users.noreply.github.com"
          git add data/policies.json data/sync-state.json data/review-queue
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: weekly policy check"
            git push
          fi
