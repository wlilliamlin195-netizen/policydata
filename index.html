<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="全球人力资源新旧政策对比数据库">
  <title>Policy Data Base｜全球新旧政策对比</title>
  <link rel="stylesheet" href="./styles.css?v=1.2.0">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="site-header">
    <a class="brand" href="#" aria-label="Policy Data Base 首页">
      <img class="brand-mark" src="./assets/xiaomi-logo.png" alt="小米标志">
      <span>
        <strong>Policy Data Base</strong>
        <small>GLOBAL HR POLICY DATABASE</small>
      </span>
    </a>
  </header>

  <main id="main-content">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">GLOBAL HR POLICY DATABASE</p>
        <h1 id="page-title">全球新旧<br><span>政策对比</span></h1>
        <p class="hero-intro">将全球新规与旧规并排呈现，帮助跨境 HR 快速识别成本、薪资、签证与用工流程中的真实变化。</p>
      </div>
    </section>

    <section class="content-shell" aria-label="政策数据库">
      <section id="comparison-view" aria-labelledby="comparison-heading">
        <div class="metrics" aria-label="政策概览">
          <article>
            <span>已核验政策</span>
            <strong id="metric-total">—</strong>
          </article>
          <article>
            <span>高影响变更</span>
            <strong id="metric-high">—</strong>
          </article>
          <article>
            <span>覆盖法域</span>
            <strong id="metric-regions">—</strong>
          </article>
        </div>

        <form class="filters" id="filter-form" role="search">
          <label class="search-field">
            <span class="sr-only">搜索政策</span>
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜索政策、数值或 HR 动作">
          </label>
          <label>
            <span class="sr-only">法域</span>
            <select id="region-filter">
              <option value="ALL">全部法域</option>
            </select>
          </label>
          <label>
            <span class="sr-only">政策类型</span>
            <select id="category-filter">
              <option value="ALL">全部类型</option>
            </select>
          </label>
          <label class="verified-toggle">
            <input id="verified-filter" type="checkbox" checked>
            <span>仅看已核验</span>
          </label>
          <button id="reset-filters" class="text-button" type="reset">重置</button>
        </form>

        <div class="results-heading">
          <div>
            <p class="eyebrow">POLICY CHANGES</p>
            <h2 id="comparison-heading">新旧政策差异</h2>
          </div>
          <p id="results-count" aria-live="polite">正在加载…</p>
        </div>

        <div id="policy-list" class="policy-list" aria-live="polite"></div>
        <div id="empty-state" class="empty-state" hidden>
          <strong>没有找到符合条件的政策</strong>
          <p>尝试减少筛选条件或更换搜索词。</p>
        </div>
      </section>

    </section>
  </main>

  <footer>
    <p>本网站用于企业 HR 合规信息整理，不构成法律意见。任何决策请回到所列官方原文并咨询当地专业人士。</p>
    <p>Policy Data Base · 全球新旧政策对比</p>
  </footer>

  <noscript>请启用 JavaScript 以加载政策对比数据。</noscript>
  <script type="module" src="./app.js?v=1.2.0"></script>
</body>
</html>
